name = "i-store-customer-portal-api"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

[assets]
directory = "../dist-cloud"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/internal/*", "/health"]

# Create this database before deployment:
#   wrangler d1 create i-store-customer-portal
# Then replace the placeholder with its returned database_id.
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "i-store-customer-portal"
database_id = "723c3ed5-ce5c-40c6-8c0e-5a7877c86c3a"

# Secrets set with `wrangler secret put`, never committed:
# POS_SHARED_SECRET
# RECEIPT_TOKEN_SECRET
# TURNSTILE_SECRET_KEY
# OTP_HMAC_SECRET
# SESSION_SECRET
# PC_BRIDGE_TOKEN, PC_BRIDGE_STORE_REF, DELIVERY_ENCRYPTION_KEY
# POS_API_BASE_URL
# POS_PORTAL_API_TOKEN

[vars]
ENVIRONMENT = "staging"
PORTAL_ENABLED = "false"
PORTAL_ORIGIN = "https://i-store-customer-portal-one.vercel.app"

[triggers]
crons = ["17 3 * * *"]
